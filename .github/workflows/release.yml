name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'javiermoya2504/lazygit-ai'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - name: Test AI integration
        run: go test ./pkg/ai ./pkg/config ./pkg/gui/controllers/helpers -short
      - name: Validate shell installer
        run: shellcheck scripts/install.sh
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
      - uses: goreleaser/goreleaser-action@e24998b8b67b290c2fa8b7c14fcfa7de2c5c9b8c # v7.1.0
        with:
          distribution: goreleaser
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
